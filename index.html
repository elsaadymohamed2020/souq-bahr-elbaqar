<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>سوق بحر البقر الكبير | كل المعروض بسعره</title>
    <meta name="description" content="الموقع الرسمي لسوق بحر البقر الكبير. كل المعروض بالأسعار المحدثة: أجهزة منزلية ومعدات صناعية أوروبية مستوردة، وحجز مباشر على واتساب." />
    <meta name="theme-color" content="#F59E0B" />
    <!-- Apply the saved theme before first paint so dark mode never flashes white -->

      try {
        if (JSON.parse(localStorage.getItem('bb_theme')) === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
